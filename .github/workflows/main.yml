# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: GitHub Statistics

on:
  push:
    branches: [ main ]
  schedule:
  - cron: '30 */3 * * *'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven target
      id: cache-maven-target
      uses: actions/cache@v4
      with:
        path: target
        key: cache-maven-target-${{ runner.os }}-${{ hashFiles('**/pom.xml', 'src/**') }}
        restore-keys: |
          cache-maven-target-${{ runner.os }}-
        
    - name: Build with Maven
      if: steps.cache-maven-target.outputs.cache-hit != 'true'
      run: mvn --batch-mode verify

    - name: Compile statistics
      run: |
        java --version
        java -cp target/gs-1.0-jar-with-dependencies.jar Main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

    - name: Checkout GitHub Overview repository
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository_owner }}/github-overview
        path: github_overview
        token: ${{ secrets.ACCESS_TOKEN }}

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Python virtual environment
      id: cache-python-venv
      uses: actions/cache@v4
      with:
        path: github_overview/venv
        key: cache-python-venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('github_overview/requirements.txt') }}
        restore-keys: |
          cache-python-venv-${{ runner.os }}-

    - name: Install Python dependencies
      if: steps.cache-python-venv.outputs.cache-hit != 'true'
      run: |
        cd github_overview
        python -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Run GitHub Overview script
      run: |
        cd github_overview
        source venv/bin/activate
        python main.py
        
    - name: Commit new outputs
      run: |
        git config --global user.name 'github-statistics'
        git config --global user.email 'github-statistics@tanjeffreyz.github.io'
        git add * || true
        git commit -m 'Update outputs' || true
        git push

    - name: Checkout GitHub profile repository
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository_owner }}/${{ github.repository_owner }}
        path: github_profile
        token: ${{ secrets.ACCESS_TOKEN }}

    - name: Update GitHub profile
      run: |
        cp github_overview/generated_readme.md github_profile/README.md
        cd github_profile
        git config --global user.name 'github-overview'
        git config --global user.email 'github-overview@tanjeffreyz.github.io'
        git add README.md
        git commit -m 'Update README.md' || true
        git push
